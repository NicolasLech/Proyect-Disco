<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Registro</title>
</head>
<body>
    <h2>Formulario de Registro</h2>
    <form id="registroForm">
        <!-- Input de nombre y apellido -->
        <label for="nombreApellido">Nombre y Apellido:</label>
        <input type="text" id="nombreApellido" name="nombreApellido" required>
        <br><br>

        <!-- Input de e-mail con placeholder -->
        <label for="email">Correo Electrónico:</label>
        <input type="email" id="email" name="email" placeholder="ejemplo@correo.com" required>
        <br><br>

        <!-- Radio buttons para el género -->
        <label>Género:</label><br>
        <input type="radio" id="femenino" name="genero" value="Femenino" required>
        <label for="femenino">Femenino</label><br>
        <input type="radio" id="masculino" name="genero" value="Masculino">
        <label for="masculino">Masculino</label><br>
        <input type="radio" id="nobinario" name="genero" value="No binario">
        <label for="nobinario">No binario</label><br>
        <input type="radio" id="prefierono" name="genero" value="Prefiero no decirlo">
        <label for="prefierono">Prefiero no decirlo</label><br><br>

        <!-- Dropdown para el rango de edad -->
        <label for="edad">Rango de Edad:</label>
        <select id="edad" name="edad" required>
            <option value="" disabled selected>Seleccionar</option>
            <option value="menor18">Menor a 18 años</option>
            <option value="19-30">19-30 años</option>
            <option value="31-45">31-45 años</option>
            <option value="46-55">46-55 años</option>
            <option value="mayor56">Mayor a 56 años</option>
        </select>
        <br><br>

        <!-- Checkbox para si es argentino -->
        <label for="argentino">¿Sos argentino?</label>
        <input type="checkbox" id="argentino" name="argentino">
        <br><br>

        <!-- Botón de enviar -->
        <button type="submit">Enviar</button>
    </form>

    <!-- JavaScript -->
    <script>
        document.getElementById("registroForm").addEventListener("submit", function(event) {
            event.preventDefault(); // Evita el envío automático del formulario
            const nombreApellido = document.getElementById("nombreApellido").value;
            const email = document.getElementById("email").value;
            const genero = document.querySelector('input[name="genero"]:checked').value;
            const edad = document.getElementById("edad").value;
            const esArgentino = document.getElementById("argentino").checked;

            console.log("Nombre y Apellido:", nombreApellido);
            console.log("Correo Electrónico:", email);
            console.log("Género:", genero);
            console.log("Rango de Edad:", edad);
            console.log("Es Argentino:", esArgentino ? "Sí" : "No");
        });
    </script>
</body>
</html>
