<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AddSongs</title>
    <link rel="stylesheet" href="./css/estilos.css">
    <!-- favicon -->
    <link rel="icon" type="image/x-icon" href="./assets/Favico.Kiss.ico">
    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>

<body class="bg-gray-900 text-white flex min-h-screen">

    <!-- Sidebar -->
    <div class="w-64 bg-gray-800 p-6 flex flex-col justify-between h-screen border-r-4 border-red-500">
        <!-- Parte superior con usuario e ícono de la banda -->
        <div>
            <div class="mb-10 text-center border-b pb-4 border-gray-600">
                <img src="./assets/foto relacionada con la banda.jfif" alt="Banda Icono" class="w-24 h-24 rounded-full mx-auto mb-4 border-4 border-red-500">
                <h2 class="text-xl font-semibold text-red-500">Lancelot</h2>
            </div>

            <!-- Secciones de navegación -->
            <div class="space-y-6">
                <a href="index.html" class="block py-2 text-lg hover:bg-red-600 rounded-lg text-center bg-gray-700">Other Albums</a>
                <a href="editAlbum.html" class="block py-2 text-lg hover:bg-red-600 rounded-lg text-center bg-gray-700">Edit Album</a>
                <a href="addSongs.html" class="block py-2 text-lg hover:bg-red-600 rounded-lg text-center bg-gray-700">Add Songs</a>
            </div>
        </div>

        <!-- Log out abajo del todo -->
        <div>
            <a href="login.html" class="block py-2 text-lg hover:bg-red-600 rounded-lg text-center bg-gray-700">Log out</a>
        </div>
    </div>

    <!-- Formulario principal para añadir canción -->
    <div class="flex-grow flex justify-center items-center p-8 bg-gray-800">
        <div class="max-w-lg w-full bg-gray-700 p-8 rounded-lg shadow-2xl border-2 border-red-500">
            <h2 class="text-3xl font-bold text-red-500 mb-6 text-center">Añadir Canción</h2>

            <form id="addSongForm" action="/addAlbum" method="POST" class="space-y-6" onsubmit="return validateForm(event)">
                <!-- Título de la canción -->
                <div>
                    <label for="title" class="block text-lg font-medium text-white">Título de la Canción</label>
                    <input type="text" id="title" name="title" placeholder="Ingrese el título de la canción" required
                        class="w-full p-3 border border-gray-600 rounded-lg focus:outline-none focus:ring-2 focus:ring-red-500 bg-gray-800 text-white">
                </div>

                <!-- Duración -->
                <div>
                    <label for="duration" class="block text-lg font-medium text-white">Duración</label>
                    <input type="text" id="duration" name="duration" placeholder="Ingrese la duración mm/ss" required
                        class="w-full p-3 border border-gray-600 rounded-lg focus:outline-none focus:ring-2 focus:ring-red-500 bg-gray-800 text-white">
                </div>

                <!-- URL de la canción -->
                <div>
                    <label for="url" class="block text-lg font-medium text-white">URL de la canción (YouTube/Spotify)</label>
                    <input type="url" id="url" name="url" placeholder="Ingrese la URL de la canción" required
                        class="w-full p-3 border border-gray-600 rounded-lg focus:outline-none focus:ring-2 focus:ring-red-500 bg-gray-800 text-white">
                </div>

                <!-- Botón de envío -->
                <div class="flex justify-center">
                    <button type="submit"
                        class="px-6 py-3 bg-red-500 text-white text-lg font-bold rounded-lg hover:bg-red-600 transition duration-300">
                        Añadir Canción
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script>
        function validateForm(event) {
            event.preventDefault();  // Evitar el envío automático del formulario
            
            const title = document.getElementById('title').value.trim();
            const duration = document.getElementById('duration').value.trim();
            const url = document.getElementById('url').value.trim();

            // Validar título
            if (title === "") {
                Swal.fire({
                    icon: 'error',
                    title: 'Error en el título',
                    text: 'Por favor, ingrese el título de la canción.',
                });
                return false;
            }

            // Validar duración (mm:ss)
            const durationRegex = /^[0-9]{1,2}:[0-5][0-9]$/;
            if (!durationRegex.test(duration)) {
                Swal.fire({
                    icon: 'error',
                    title: 'Error en la duración',
                    text: 'La duración debe estar en formato mm:ss.',
                });
                return false;
            }

            // Validar URL (YouTube o Spotify)
            const urlRegex = /^(https?:\/\/)?(www\.)?(youtube\.com|youtu\.be|spotify\.com)\/.+$/;
            if (!urlRegex.test(url)) {
                Swal.fire({
                    icon: 'error',
                    title: 'Error en la URL',
                    text: 'Ingrese una URL válida de YouTube o Spotify.',
                });
                return false;
            }

            // Si todo está bien, mostrar alerta de éxito y enviar el formulario
            Swal.fire({
                icon: 'success',
                title: 'Canción agregada exitosamente',
                showConfirmButton: false,
                timer: 1500
            }).then(() => {
                document.getElementById('addSongForm').submit();  // Enviar el formulario después de la alerta de éxito
            });

            return true;
        }
    </script>
</body>

</html>
